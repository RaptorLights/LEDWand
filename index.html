<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LED-Wand Testvideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
<style>
/* Layout: Pult-Optik — links Regler-Spalte, rechts die Bühne (Editor / Vorschau). Bewusst nur dunkel, wie am FOH. */
:root {
  --bg: #0f1216;
  --panel: #161a20;
  --panel-2: #1d222a;
  --line: #2a313b;
  --fg: #e7eaef;
  --muted: #8a93a2;
  --accent: #ffb000;
  --accent-ink: #1a1200;
  --danger: #ff5d52;
  --ok: #3fcf8e;
  --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--ui); padding-inline: 16px; padding-block: 12px 24px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: .01em; margin: 0; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0; }
button, input, select { font: inherit; color: inherit; }
.mono, input[type=number] { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.chip b { color: var(--fg); font-weight: 500; }
.chip.warn { border-color: var(--danger); color: var(--danger); }

.app { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }

aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.row > label.check { flex-direction: row; font-size: 14px; color: var(--fg); }
input[type=number], input[type=text], select {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 7px; min-width: 0;
}
input[type=number] { width: 78px; }
input:focus-visible, select:focus-visible, button:focus-visible, .sw:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 11px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.msg { font-size: 13px; min-height: 1em; margin: 0; }
.msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }

/* Modultypen */
.types { display: flex; flex-direction: column; gap: 6px; }
.type { display: grid; grid-template-columns: 26px minmax(0, 1fr) 64px 10px 64px 28px; gap: 6px; align-items: center; padding: 4px; border-radius: 3px; border: 1px solid transparent; cursor: pointer; }
.type.active { border-color: var(--accent); background: var(--panel-2); }
.type .dot { width: 22px; height: 22px; border-radius: 2px; }
.type input[type=number] { width: 100%; }
.type .x { color: var(--muted); text-align: center; font-family: var(--mono); }
.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }
.icon-btn:hover { color: var(--danger); }

/* Farben */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; width: 44px; height: 44px; border-radius: 3px; border: 1px solid var(--line); overflow: hidden; }
.sw input { position: absolute; inset: -8px; width: 60px; height: 60px; border: 0; padding: 0; cursor: pointer; }
.sw .del { position: absolute; top: 0; right: 0; background: rgba(0,0,0,.6); color: #fff; border: 0; font-size: 12px; width: 16px; height: 16px; line-height: 16px; padding: 0; cursor: pointer; }
.sw.add { display: grid; place-items: center; font-size: 22px; color: var(--muted); background: var(--panel-2); cursor: pointer; }

/* Bühne */
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (max-width: 900px) { .stage { position: static; } }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
.canvas-box { background: #07090b; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; overflow: hidden; min-height: 260px; }
#ed { width: 100%; height: min(62vh, 620px); display: block; touch-action: none; cursor: crosshair; }
#pv { max-width: 100%; max-height: min(62vh, 620px); display: block; image-rendering: auto; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.sel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.inline-confirm { display: flex; gap: 6px; align-items: center; font-size: 13px; }
input[type=range] { accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

</head>
<body>
<header class="top">
  <h1>LED-Wand Testvideo</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="app">
  <aside>
    <section class="sec">
      <div class="sec-h"><h2>Modultypen (px)</h2><button class="btn small" id="addType">+ Typ</button></div>
      <div class="types" id="types"></div>
      <p class="hint">Aktiven Typ anklicken, dann im Editor ins Raster klicken, um ein Modul zu setzen.</p>
    </section>

    <section class="sec">
      <h2>Block einfügen</h2>
      <div class="row">
        <label>Typ<select id="gType"></select></label>
        <label>Spalten<input type="number" id="gCols" min="1" value="8"></label>
        <label>Reihen<input type="number" id="gRows" min="1" value="1"></label>
      </div>
      <div class="row">
        <label class="grow">Position<select id="gPos">
          <option value="below">Unter die Wand</option>
          <option value="above">Über die Wand</option>
          <option value="right">Rechts daneben</option>
          <option value="left">Links daneben</option>
          <option value="xy">Eigene X / Y</option>
        </select></label>
        <label>X<input type="number" id="gX" value="0" disabled></label>
        <label>Y<input type="number" id="gY" value="0" disabled></label>
      </div>
      <div class="row"><button class="btn primary" id="gAdd">Block einfügen</button><span id="clearWrap"><button class="btn danger" id="clearAll">Wand leeren</button></span></div>
      <p class="msg" id="gMsg"></p>
      <div class="row">
        <button class="btn small" id="expJson">Layout speichern (.json)</button>
        <label class="btn small" style="flex-direction:row;color:var(--fg);font-size:13px">Layout laden<input type="file" id="impJson" accept=".json,application/json" hidden></label>
      </div>
    </section>

    <section class="sec">
      <h2>Ausgabe</h2>
      <label class="check"><input type="checkbox" id="outAuto"> Auflösung = Wandgröße</label>
      <div class="row" id="outCustom">
        <label>Breite<input type="number" id="outW" min="16"></label>
        <label>Höhe<input type="number" id="outH" min="16"></label>
        <button class="btn small" data-res="1920x1080">1080p</button>
        <button class="btn small" data-res="3840x2160">4K</button>
      </div>
    </section>

    <section class="sec">
      <h2>Testbild</h2>
      <div class="swatches" id="colors"></div>
      <div class="row">
        <label>Checker px (0 = auto)<input type="number" id="checker" min="0"></label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="pLabels"> Beschriftung C/R</label>
        <label class="check"><input type="checkbox" id="pFrames"> Modulrahmen</label>
        <label class="check"><input type="checkbox" id="pDiag"> Diagonalen</label>
        <label class="check"><input type="checkbox" id="pCircle"> Kreis</label>
        <label class="check"><input type="checkbox" id="pInfo"> Auflösung anzeigen</label>
      </div>
      <div class="row">
        <label class="btn small" style="flex-direction:row;color:var(--fg);font-size:13px">Logo-PNG wählen<input type="file" id="logoIn" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden></label>
        <button class="btn small danger" id="logoDel" hidden>Logo entfernen</button>
      </div>
      <div id="logoCtl" hidden style="display:flex;flex-direction:column;gap:6px">
        <label class="row" style="font-size:13px;color:var(--muted)"><span style="width:62px">Größe</span><input type="range" id="logoScale" min="2" max="100" class="grow"><input type="number" id="logoScaleN" min="2" max="100" style="width:64px"><span>%</span></label>
        <label class="row" style="font-size:13px;color:var(--muted)"><span style="width:62px">Horizontal</span><input type="range" id="logoX" min="-50" max="50" class="grow"><span class="mono" id="logoXV" style="width:44px;text-align:right"></span></label>
        <label class="row" style="font-size:13px;color:var(--muted)"><span style="width:62px">Vertikal</span><input type="range" id="logoY" min="-50" max="50" class="grow"><span class="mono" id="logoYV" style="width:44px;text-align:right"></span></label>
        <div class="row">
          <label class="grow">Effekt<select id="logoFx">
            <option value="glow">Helles Leuchten</option>
            <option value="outline">Weiße Kontur</option>
            <option value="shadow">Dunkler Schatten</option>
            <option value="plateLight">Helle Platte</option>
            <option value="plateDark">Dunkle Platte</option>
            <option value="none">Kein Effekt</option>
          </select></label>
          <label>Logo-Farbe<select id="logoTint"><option value="original">Original</option><option value="white">Weiß</option></select></label>
        </div>
        <label class="row" style="font-size:13px;color:var(--muted)"><span style="width:62px">Stärke</span><input type="range" id="logoFxStr" min="0" max="100" class="grow"><span class="mono" id="logoFxStrV" style="width:44px;text-align:right"></span></label>
        <label class="row" style="font-size:13px;color:var(--muted)"><span style="width:62px">Abstand Auflösung</span><input type="range" id="infoGap" min="0" max="300" step="5" class="grow"><span class="mono" id="infoGapV" style="width:44px;text-align:right"></span></label>
        <div class="row"><button class="btn small" id="logoReset">Zentrieren</button><span class="hint">Größe in % der Wandhöhe</span></div>
      </div>
    </section>

    <section class="sec">
      <h2>Animation</h2>
      <div class="row">
        <label class="grow">Aufbau<select id="aOrder">
          <option value="bottom-up">Von unten nach oben</option>
          <option value="top-down">Von oben nach unten</option>
          <option value="columns">Spaltenweise, links nach rechts</option>
        </select></label>
        <label>FPS<select id="aFps"><option>25</option><option>30</option><option>50</option><option>60</option></select></label>
      </div>
      <div class="row">
        <label>Tempo<input type="number" id="aSpeed" min="0.25" max="20" step="0.25"></label>
        <label>Standzeit s<input type="number" id="aHold" min="0" max="30" step="0.5"></label>
        <label>Figur %<input type="number" id="aFig" min="20" max="120" step="5"></label>
      </div>
      <div class="row">
        <label class="grow">Figur<select id="aFigType">
          <option value="worker">Bauarbeiter</option>
          <option value="crew">Stagehand (schwarz)</option>
          <option value="beagle">Hund: Beagle</option>
          <option value="golden">Hund: Golden Retriever</option>
          <option value="dalmatian">Hund: Dalmatiner</option>
          <option value="none">Keine Figur (Module gleiten)</option>
        </select></label>
      </div>
      <label class="check"><input type="checkbox" id="aLoop"> Am Ende wieder abbauen (Loop)</label>
      <label class="row" style="font-size:13px;color:var(--muted)">Laufhöhe <input type="range" id="aGround" min="0" max="100" class="grow"><span class="mono" id="aGroundV"></span></label>
      <p class="hint">Laufhöhe: 0 % = Figur läuft am unteren Wandrand, 100 % = am oberen.</p>
    </section>

    <section class="sec">
      <h2>Export</h2>
      <div class="row">
        <button class="btn primary" id="render">MP4 rendern</button>
        <button class="btn" id="cancel" hidden>Abbrechen</button>
        <button class="btn primary" id="saveVid" hidden>Video speichern</button>
      </div>
      <div class="progress" id="prog" hidden><i></i></div>
      <p class="msg" id="rMsg"></p>
      <h2>Standbilder (PNG)</h2>
      <div class="row" id="pngs"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabEd" aria-selected="true">Layout</button>
      <button class="tab" role="tab" id="tabPv" aria-selected="false">Vorschau</button>
    </div>
    <div id="edWrap">
      <div class="canvas-box"><canvas id="ed"></canvas></div>
      <div class="sel bar" id="selBar" style="margin-top:10px"></div>
    </div>
    <div id="pvWrap" hidden>
      <div class="canvas-box"><canvas id="pv"></canvas></div>
      <div class="bar" style="margin-top:10px">
        <button class="btn primary" id="play">▶ Abspielen</button>
        <input type="range" id="scrub" min="0" value="0" aria-label="Zeitleiste">
        <span class="mono" id="tc">0:00 / 0:00</span>
      </div>
      <div class="bar" id="jumps" style="margin-top:8px"></div>
    </div>
  </section>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TINTS = ['#4f7cff', '#ff6ad5', '#3fcf8e', '#ffb000', '#27c8ff', '#b88bff', '#ff7a45', '#c9d15a'];
const KEY = 'ledwand-testvideo-v1';

function defaults() {
  const types = [{ id: 't1', w: 128, h: 256 }, { id: 't2', w: 128, h: 128 }];
  const modules = [];
  for (let c = 0; c < 8; c++) {
    modules.push({ t: 't2', x: c * 128, y: 0 });
    modules.push({ t: 't2', x: c * 128, y: 128 });
    modules.push({ t: 't1', x: c * 128, y: 256 });
  }
  return {
    types, modules, sel: -1, activeType: 't2', nextId: 3,
    out: { auto: true, w: 1920, h: 1080 },
    colors: ['#1e3cff', '#ff3cff', '#00c850', '#ff2828', '#00c8ff', '#ffffff'],
    pat: { checker: 0, labels: true, frames: true, diag: true, circle: true, info: true, logoScale: 35, logoX: 0, logoY: 0, infoGap: 30, logoFx: 'glow', logoFxStr: 50, logoTint: 'original' },
    anim: { order: 'bottom-up', fps: 30, speed: 1, hold: 2, fig: 80, figType: 'worker', ground: 0, loop: false },
    logo: null
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.modules)) S = defaults();
S.sel = -1;
if (!S.anim.figType) S.anim.figType = S.anim.figOn === false ? 'none' : 'worker';
if (S.anim.ground == null) S.anim.ground = 0;
let logoImg = null;
let saveT = 0;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { try { localStorage.setItem(KEY, JSON.stringify({ ...S, logo: null })); } catch (e2) {} }
  }, 300);
}

/* ---------- Geometrie ---------- */
const typeMap = () => Object.fromEntries(S.types.map(t => [t.id, t]));
function mods() { const tm = typeMap(); return S.modules.map((m, i) => ({ ...m, i, w: tm[m.t].w, h: tm[m.t].h })); }
function bbox(ms = mods()) {
  if (!ms.length) return { x: 0, y: 0, w: 0, h: 0, r: 0, b: 0 };
  const x = Math.min(...ms.map(m => m.x)), y = Math.min(...ms.map(m => m.y));
  const r = Math.max(...ms.map(m => m.x + m.w)), b = Math.max(...ms.map(m => m.y + m.h));
  return { x, y, w: r - x, h: b - y, r, b };
}
function outSize() {
  const b = bbox();
  let W = S.out.auto ? b.r : S.out.w, H = S.out.auto ? b.b : S.out.h;
  W = Math.max(16, Math.round(W)); H = Math.max(16, Math.round(H));
  return { W: W + (W % 2), H: H + (H % 2) };
}
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function overlaps(ms = mods()) {
  const bad = new Set();
  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++)
    if (overlap(ms[i], ms[j])) { bad.add(i); bad.add(j); }
  return bad;
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
function snapStep() { return S.types.reduce((g, t) => gcd(gcd(g, t.w), t.h), 0) || 16; }
function normalize() {
  if (!S.modules.length) return;
  const b = bbox();
  const dx = b.x < 0 || S.out.auto ? -b.x : 0, dy = b.y < 0 || S.out.auto ? -b.y : 0;
  if (dx || dy) S.modules.forEach(m => { m.x += dx; m.y += dy; });
}
function labels(ms) {
  const tops = [...new Set(ms.map(m => m.y))].sort((a, b) => a - b);
  const out = new Map();
  tops.forEach((y, r) => ms.filter(m => m.y === y).sort((a, b) => a.x - b.x).forEach((m, c) => out.set(m.i, `C${c + 1} R${r + 1}`)));
  return out;
}
function buildOrder(ms) {
  const a = [...ms];
  if (S.anim.order === 'top-down') a.sort((p, q) => p.y - q.y || p.x - q.x);
  else if (S.anim.order === 'columns') a.sort((p, q) => p.x - q.x || (q.y + q.h) - (p.y + p.h));
  else a.sort((p, q) => (q.y + q.h) - (p.y + p.h) || p.x - q.x);
  return a;
}

/* ---------- Farbe ---------- */
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const css = c => `rgb(${c.map(Math.round).join(',')})`;
const shade = (c, f) => c.map(v => Math.max(0, Math.min(255, v * f)));
const mixW = (c, f) => c.map(v => v + (255 - v) * f);

/* ---------- Testbild ---------- */
let wallKey = '', walls = [];
function getWalls() {
  const key = JSON.stringify([S.types, S.modules, S.out, S.colors, S.pat, !!logoImg, S.logo && S.logo.length, S.pat.logoX, S.pat.logoY, S.pat.logoFx, S.pat.logoFxStr, S.pat.logoTint]);
  if (key !== wallKey) { wallKey = key; walls = []; }
  return new Proxy(walls, { get: (t, p) => (typeof p === 'string' && /^\d+$/.test(p) && +p < S.colors.length) ? (t[p] || (t[p] = buildWall(S.colors[+p]))) : t[p] });
}
function silhouette(img, w, h, color) {
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function drawLogo(g, x, y, w, h) {
  const k = S.pat.logoFxStr / 100, fx = S.pat.logoFx;
  const img = S.pat.logoTint === 'white' ? silhouette(logoImg, w, h, '#ffffff') : logoImg;
  const ref = Math.min(h, w * .5);
  g.save();
  if (fx === 'plateLight' || fx === 'plateDark') {
    const p = ref * .14;
    g.fillStyle = fx === 'plateLight' ? `rgba(255,255,255,${.35 + .6 * k})` : `rgba(0,0,0,${.35 + .6 * k})`;
    g.beginPath(); g.roundRect(x - p, y - p, w + 2 * p, h + 2 * p, p * .8); g.fill();
  } else if (fx === 'outline' && k > 0) {
    const r = Math.max(1, ref * .045 * k), sil = silhouette(logoImg, w, h, '#ffffff');

function drawDog(g, F, x, ground, h, phase, face, wag, carry, opts = {}) {

  $('#logoFxStr').oninput = () => logoSet('logoFxStr', $('#logoFxStr').value, 0, 100);
  $('#logoFx').onchange = () => { S.pat.logoFx = $('#logoFx').value; syncLogo(); showLogoPreview(); changed(); };
  $('#logoTint').onchange = () => { S.pat.logoTint = $('#logoTint').value; syncLogo(); showLogoPreview(); changed(); };
  $('#infoGap').oninput = () => logoSet('infoGap', $('#infoGap').value, 0, 300);
  $('#logoReset').onclick = () => { S.pat.logoX = 0; S.pat.logoY = 0; syncLogo(); showLogoPreview(); changed(); };
  $('#aOrder').value = S.anim.order; $('#aOrder').onchange = () => { S.anim.order = $('#aOrder').value; changed(); };
  $('#aFps').value = String(S.anim.fps); $('#aFps').onchange = () => { S.anim.fps = +$('#aFps').value; changed(); };
  bindNum('#aSpeed', () => S.anim, 'speed', .25, 20); bindNum('#aHold', () => S.anim, 'hold', 0, 30); bindNum('#aFig', () => S.anim, 'fig', 20, 120);
  $('#aFigType').value = S.anim.figType;
  $('#aFigType').onchange = () => {
    const was = FIGS[S.anim.figType], nt = $('#aFigType').value, now = FIGS[nt];
    S.anim.figType = nt;
    if (was && now && was.kind !== now.kind) { S.anim.fig = now.kind === 'dog' ? 40 : 80; $('#aFig').value = S.anim.fig; }
    changed();
  };
  bindCheck('#aLoop', () => S.anim, 'loop');
  $('#aGround').value = S.anim.ground; $('#aGroundV').textContent = S.anim.ground + ' %';
  $('#aGround').oninput = () => { S.anim.ground = +$('#aGround').value; $('#aGroundV').textContent = S.anim.ground + ' %'; changed(); };
}
function renderColors() {
  const box = $('#colors');
  box.innerHTML = S.colors.map((c, i) => `<div class="sw" style="background:${c}"><input type="color" value="${c}" data-i="${i}" aria-label="Farbe ${i + 1}">${S.colors.length > 1 ? `<button class="del" data-del="${i}" aria-label="Farbe ${i + 1} entfernen">×</button>` : ''}</div>`).join('')
    + '<button class="sw add" id="addColor" aria-label="Farbe hinzufügen">+</button>';
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => { S.colors[+inp.dataset.i] = inp.value; changed(); }));
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.colors.splice(+b.dataset.del, 1); changed(); });
  $('#addColor').onclick = () => { S.colors.push('#ffffff'); changed(); };
}
function trimLogo(im) {
  try {
    const w = im.naturalWidth || im.width || 512, h = im.naturalHeight || im.height || 512;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (d[(yy * w + xx) * 4 + 3] > 10) {
      if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
    }
    if (x1 < 0) return c;
    const t = document.createElement('canvas'); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
    t.getContext('2d').drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
    return t;
  } catch (e) { return im; }
}
function loadLogo() {
  $('#logoDel').hidden = $('#logoCtl').hidden = !S.logo;
  if (!S.logo) { logoImg = null; return; }
  const im = new Image(); im.onload = () => { logoImg = trimLogo(im); changed(); }; im.src = S.logo;
}
$('#logoIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { S.logo = r.result; loadLogo(); showLogoPreview(); }; r.readAsDataURL(f); e.target.value = '';
};
$('#logoDel').onclick = () => { S.logo = null; loadLogo(); changed(); };

/* ---------- Downloads ---------- */
let dl = null;
(async () => { try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; } })();
async function offer(filename, data, msgSel) {
  if (!dl) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    flash(msgSel, `${filename} wird heruntergeladen.`, 'ok'); return;
  }
  try { await dl.save({ filename, data }); flash(msgSel, `${filename} gespeichert.`, 'ok'); }
  catch (e) { flash(msgSel, e && e.code === 'declined' ? 'Speichern abgebrochen.' : 'Speichern fehlgeschlagen: ' + ((e && e.message) || e), 'err'); }
}
$('#expJson').onclick = () => {
  const { sel, logo, ...rest } = S;
  offer('ledwand_layout.json', JSON.stringify(rest, null, 2), '#gMsg');
};
$('#impJson').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!Array.isArray(d.types) || !Array.isArray(d.modules)) throw new Error('keine Layout-Datei');
    const logo = S.logo; S = { ...defaults(), ...d, logo, sel: -1 };
    bindAll(); changed(); flash('#gMsg', 'Layout geladen.', 'ok');
  }).catch(err => flash('#gMsg', 'Datei konnte nicht gelesen werden: ' + err.message, 'err'));
  e.target.value = '';
};
function renderPngs() {
  $('#pngs').innerHTML = S.colors.map((c, i) => `<button class="btn small" data-png="${i}"><span style="display:inline-block;width:10px;height:10px;background:${c};margin-right:6px;border-radius:2px"></span>Farbe ${i + 1}</button>`).join('');
  $('#pngs').querySelectorAll('[data-png]').forEach(b => b.onclick = () => {
    const i = +b.dataset.png, { W, H } = outSize();
    getWalls()[i].toBlob(bl => offer(`ledwand_${W}x${H}_farbe${i + 1}.png`, bl, '#rMsg'), 'image/png');
  });
}

/* ---------- Vorschau ---------- */
const pv = $('#pv'), pg = pv.getContext('2d');
let cur = 0, playing = false, lastT = 0, acc = 0;
function drawPreview() {
  const { W, H } = outSize();
  if (pv.width !== W || pv.height !== H) { pv.width = W; pv.height = H; }
  if (!TL) timeline();
  cur = Math.min(cur, TL.total - 1);
  renderFrame(pg, cur);
  $('#scrub').max = TL.total - 1; $('#scrub').value = cur;
  $('#tc').textContent = `${fmt(cur / S.anim.fps)} / ${fmt(TL.total / S.anim.fps)}`;
}
function tick(t) {
  if (!playing) return;
  acc += t - lastT; lastT = t;
  const fd = 1000 / S.anim.fps;
  if (acc >= fd) { cur += Math.floor(acc / fd); acc %= fd; if (cur >= TL.total) cur = 0; drawPreview(); }
  requestAnimationFrame(tick);
}
function setPlay(p) { playing = p; $('#play').textContent = p ? '❚❚ Pause' : '▶ Abspielen'; if (p) { lastT = performance.now(); acc = 0; requestAnimationFrame(tick); } }
$('#play').onclick = () => setPlay(!playing);
$('#scrub').oninput = () => { cur = +$('#scrub').value; drawPreview(); };
function renderJumps() {
  if (!TL) timeline();
  $('#jumps').innerHTML = '<span class="hint">Springen zu:</span>' + S.colors.map((c, i) => `<button class="btn small" data-j="${i}"><span style="display:inline-block;width:10px;height:10px;background:${c};margin-right:6px;border-radius:2px"></span>Farbe ${i + 1}</button>`).join('');
  $('#jumps').querySelectorAll('[data-j]').forEach(b => b.onclick = () => { const s = TL.segs.find(s => s.c === +b.dataset.j); cur = s.start; drawPreview(); });
}
function showLogoPreview() {
  if ($('#pvWrap').hidden) showTab(true);
  setPlay(false);
  if (!TL) timeline();
  const c = segAt(Math.min(cur, TL.total - 1)).c, hold = TL.segs.find(s => s.c === c && s.kind === 'hold');
  if (hold) cur = hold.start;
}
function showTab(pvTab) {
  $('#tabEd').setAttribute('aria-selected', !pvTab); $('#tabPv').setAttribute('aria-selected', pvTab);
  $('#edWrap').hidden = pvTab; $('#pvWrap').hidden = !pvTab;
  if (pvTab) drawPreview(); else { setPlay(false); drawEditor(); }
}
$('#tabEd').onclick = () => showTab(false); $('#tabPv').onclick = () => showTab(true);

/* ---------- MP4-Export ---------- */
let abort = false, lastVideo = null;
async function pickCodec(W, H, fps, bitrate) {
  const cands = [['avc1.640034', 'avc'], ['avc1.640033', 'avc'], ['avc1.64002a', 'avc'], ['avc1.4d0034', 'avc'], ['avc1.42003e', 'avc'], ['hvc1.1.6.L153.B0', 'hevc'], ['vp09.00.51.08', 'vp9']];
  for (const [codec, mux] of cands) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps, latencyMode: 'quality' };
    if (mux === 'avc') cfg.avc = { format: 'avc' };
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return { cfg: r.config, mux }; } catch (e) {}
  }
  return null;
}
$('#render').onclick = async () => {
  if (!('VideoEncoder' in window) || !window.Mp4Muxer) return flash('#rMsg', 'Dieser Browser kann kein Video kodieren. Aktuelles Chrome, Edge oder Safari verwenden.', 'err');
  if (!S.modules.length) return flash('#rMsg', 'Die Wand ist leer.', 'err');
  if (overlaps().size) return flash('#rMsg', 'Es gibt überlappende Module (rot markiert).', 'err');
  setPlay(false);
  const { W, H } = outSize(), fps = S.anim.fps; timeline();
  const bitrate = Math.round(Math.min(80e6, Math.max(6e6, W * H * fps * .15)));
  const pick = await pickCodec(W, H, fps, bitrate);
  if (!pick) return flash('#rMsg', `Kein Encoder für ${W}×${H} verfügbar. Kleinere Ausgabeauflösung versuchen.`, 'err');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: pick.mux, width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => { encErr = e; } });
  enc.configure(pick.cfg);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: false });
  abort = false; lastVideo = null;
  $('#render').disabled = true; $('#cancel').hidden = false; $('#saveVid').hidden = true; $('#prog').hidden = false;
  const bar = $('#prog i'), t0 = performance.now(), total = TL.total, gop = fps * 2;
  try {
    for (let i = 0; i < total; i++) {
      if (abort || encErr) break;
      renderFrame(g, i);
      const fr = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(fr, { keyFrame: i % gop === 0 }); fr.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (i % 15 === 0) {
        bar.style.width = (i / total * 100).toFixed(1) + '%';
        const el = (performance.now() - t0) / 1000, eta = i ? el / i * (total - i) : 0;
        $('#rMsg').className = 'msg'; $('#rMsg').textContent = `Frame ${i} / ${total} · noch ca. ${fmt(eta)}`;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    if (encErr) throw encErr;
    if (abort) { enc.close(); $('#rMsg').textContent = 'Abgebrochen.'; return; }
    await enc.flush(); enc.close(); muxer.finalize();
    lastVideo = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    bar.style.width = '100%';
    const mb = (lastVideo.size / 1048576).toFixed(1);
    flash('#rMsg', `Fertig: ${W}×${H}, ${fps} fps, ${fmt(total / fps)} min, ${mb} MB (${pick.mux.toUpperCase()}).`, 'ok');
    clearTimeout($('#rMsg')._t);
    $('#saveVid').hidden = false;
  } catch (e) {
    flash('#rMsg', 'Rendern fehlgeschlagen: ' + (e.message || e), 'err');
    try { enc.close(); } catch (e2) {}
  } finally {
    $('#render').disabled = false; $('#cancel').hidden = true;
  }
};
$('#cancel').onclick = () => { abort = true; };
$('#saveVid').onclick = () => { if (!lastVideo) return; const { W, H } = outSize(); offer(`ledwand_test_${W}x${H}.mp4`, lastVideo, '#rMsg'); };

/* ---------- Status ---------- */
function renderStats() {
  const { W, H } = outSize(), ms = mods(), bad = overlaps(ms);
  timeline();
  $('#stats').innerHTML = `<span class="chip">Wand <b>${bbox(ms).w} × ${bbox(ms).h}</b></span>
    <span class="chip">Ausgabe <b>${W} × ${H}</b></span>
    <span class="chip"><b>${ms.length}</b> Module · <b>${S.types.length}</b> Typen</span>
    <span class="chip"><b>${S.colors.length}</b> Farben · Dauer <b>${fmt(TL.total / S.anim.fps)}</b></span>
    ${bad.size ? `<span class="chip warn">${bad.size} überlappend</span>` : ''}`;
}
function changed(noPersist) {
  TL = null; renderTypes(); renderColors(); renderPngs(); renderStats(); renderJumps(); refreshEditor();
  if (!$('#pvWrap').hidden) drawPreview();
  if (!noPersist) persist();
}
bindAll(); loadLogo(); changed(true);
document.fonts && document.fonts.ready.then(() => { wallKey = ''; changed(true); });
</script>
